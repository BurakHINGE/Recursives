name: C CI (Standard)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile
      run: |
        find . -name "*.c" -exec gcc -Wall -c {} +

    - name: Install Cppcheck
      run: |
        sudo apt-get install cppcheck -y

    - name: Run Standard Static Analysis
      run: |
        # Standart bellek sızıntısı, null pointer tanımlaması ve kapsam (scope) kontrolleri
        cppcheck --enable=warning,performance,portability --force .
        echo "Standard C project check completed."
